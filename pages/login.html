
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Yatra</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header class="site-header">
        <a href="../index.html" class="site-logo">Yatra<span>.</span></a>
        <nav class="main-navigation">
            <a href="../index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="packages.html">Packages</a>
            <a href="booking.html">Booking</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="signup.html" class="login-link">Sign Up</a>
        </nav>
    </header>

    <main class="account-container">
        <section class="account-card">
            <div class="account-symbol">✈</div>
            <p class="section-label">WELCOME BACK</p>
            <h1>Login to Yatra</h1>
            <p class="account-description">
                Your next adventure is just around the corner.
            </p>

            <form action="#" method="get">
                <div class="form-field">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" name="email"
                        placeholder="you@example.com" required>
                </div>

                <div class="form-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password"
                        placeholder="Enter your password" required>
                </div>

                <button type="submit" class="primary-button">Login</button>
            </form>

            <p class="account-switch">
                New to Yatra?
                <a href="signup.html">Create an account</a>
            </p>

            <a href="../index.html" class="back-home">← Back to Home</a>
        </section>
    </main>

    <footer class="site-footer">
        <a href="../index.html" class="site-logo">Yatra<span>.</span></a>
        <p>Explore more. Worry less. Travel with Yatra.</p>
        <p>© 2026 Yatra Travel Application</p>
    </footer>
</body>
</html>
