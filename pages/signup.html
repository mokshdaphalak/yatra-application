
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Yatra</title>
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <header class="site-header">
        <a href="../index.html" class="site-logo">Yatra<span>.</span></a>
        <nav class="main-navigation">
            <a href="../index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="packages.html">Packages</a>
            <a href="booking.html">Booking</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" class="login-link">Login</a>
        </nav>
    </header>

    <main class="account-container">
        <section class="account-card">
            <div class="account-symbol">🌍</div>
            <p class="section-label">START YOUR JOURNEY</p>
            <h1>Create Account</h1>
            <p class="account-description">
                Join Yatra and start exploring amazing places.
            </p>

            <form action="#" method="get">
                <div class="form-field">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" name="name"
                        placeholder="Enter your full name" required>
                </div>

                <div class="form-field">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" name="email"
                        placeholder="you@example.com" required>
                </div>

                <div class="form-field">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password"
                        placeholder="Create a password" minlength="8" required>
                </div>

                <div class="form-field">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password"
                        name="confirm-password"
                        placeholder="Enter your password again"
                        minlength="8" required>
                </div>

                <button type="submit" class="primary-button">Create Account</button>
            </form>

            <p class="account-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <a href="../index.html" class="back-home">← Back to Home</a>
        </section>
    </main>

    <footer class="site-footer">
        <a href="../index.html" class="site-logo">Yatra<span>.</span></a>
        <p>Explore more. Worry less. Travel with Yatra.</p>
        <p>© 2026 Yatra Travel Application</p>
    </footer>
</body>
</html>
